spring:
  application:
    name: shopeasy-api
  profiles:
    default: dev
  jackson:
    deserialization:
      accept-float-as-int: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
server:
  port: ${PORT:8081}
  address: 0.0.0.0
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
app:
  security:
    admin-username: ${ADMIN_USERNAME}
    admin-password: ${ADMIN_PASSWORD}
    admin-password-min-length: ${ADMIN_PASSWORD_MIN_LENGTH:6}
    jwt-secret: ${ADMIN_JWT_SECRET}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  catalog:
    seed: ${SEED_SAMPLE_DATA:true}
    public-api-url: ${PUBLIC_API_URL:http://localhost:${PORT:8081}}
  cloudinary:
    name: ${CLOUDINARY_CLOUD_NAME:}
    key: ${CLOUDINARY_API_KEY:}
    secret: ${CLOUDINARY_API_SECRET:}
